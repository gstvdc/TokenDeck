[platformio]
; O linker Xtensa antigo não aceita o acento no caminho "Área de Trabalho".
build_dir = ${sysenv.TEMP}/clawdmeter-build

[env:cyd_28]

platform = platformio/espressif32@6.12.0
board = esp32dev
framework = arduino

; Aplicativo de 1,60 MB: usa a partição ampla de flash, sem OTA.
board_build.partitions = huge_app.csv

upload_speed = 460800
monitor_speed = 115200

build_src_filter =
    +<*>
    -<boards/>
    +<boards/cyd_28/>
    -<ble.cpp>
    ; O CYD não possui o codec de áudio usado pelas placas Waveshare.
    -<chime.cpp>
    -<es8311.c>

build_flags =
    -DBOARD_CYD_28
    -DUSE_USB_SERIAL_BRIDGE=1

    ; ESP32 clássico sem PSRAM
    ; NÃO usar -DBOARD_HAS_PSRAM

    ; LVGL leve para 320x240
    -DLV_CONF_SKIP
    -DLV_COLOR_DEPTH=16
    -DLV_USE_LOG=0
    -DLV_USE_BAR=1
    -DLV_USE_LABEL=1
    -DLV_USE_ARC=1
    -DLV_USE_BTN=1
    -DLV_USE_LINE=1
    -DLV_USE_OBJ=1
    -DLV_USE_IMG=1
    -DLV_USE_IMAGE=1
    -DLV_USE_ANIMIMG=0
    -DLV_TICK_CUSTOM=1

    ; Sem snapshot para economizar RAM
    -DLV_USE_SNAPSHOT=0

lib_deps =
    ; 1.4.7 mantém compatibilidade com Arduino-ESP32 2.x.
    moononournation/GFX Library for Arduino@1.4.7
    lvgl/lvgl@^9.2.0
    bblanchon/ArduinoJson@^7.0.0
